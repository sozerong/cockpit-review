[project]
name = "cockpit-review"
version = "0.2.3"
description = "Deterministic verification cockpit for AI-generated code — no LLM in the analysis path"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-review", "static-analysis", "ai-code", "tree-sitter", "cli"]
authors = [{ name = "cockpit contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Upper bounds hold in known-tested range. tree-sitter ships native
    # code — an unpinned major bump becomes a silent supply-chain risk
    # at `pip install`. Bump these deliberately when we test a new release.
    "tree-sitter>=0.23,<0.30",
    "tree-sitter-python>=0.23,<0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
mutation = ["mutmut>=3.2"]

[project.urls]
"Source" = "https://github.com/sozerong/cockpit-review"
"Design brief" = "https://github.com/sozerong/cockpit-review/blob/main/PROJECT_BRIEF.md"
"Issues" = "https://github.com/sozerong/cockpit-review/issues"

[project.scripts]
cockpit = "cockpit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]
# `packages` picks up the entire tree, but hatch skips non-.py files
# by default. Force-include the static dashboard so `_load_page()`
# resolves inside an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/cockpit/static/index.html" = "cockpit/static/index.html"

[tool.hatch.build.targets.sdist]
include = [
    "src/cockpit",
    "README.md",
    "LICENSE",
    "PROJECT_BRIEF.md",
    "EXECUTION_PLAN.md",
]

# ── QA gates ──────────────────────────────────────────────────────────
# Senior QA review demanded coverage floors as part of v0.3.0. The
# thresholds below are enforced in CI (`--cov-fail-under`). Raise them
# after each coverage push; never lower them to make a red build green.
#
# Aspirational per-module targets (not enforced natively — track by
# eyeball in `pytest --cov=cockpit --cov-report=term`):
#   incremental.py  >= 90%  (93% ✓)
#   diff.py         >= 85%  (86% ✓)
#   cli.py          >= 60%  (raised via test_cli_direct.py)
#   serve.py        >= 65%  (86% ✓, raised via test_serve_paths.py)
#   watch.py        >= 60%  (94% ✓, raised via test_watch.py)

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["src/cockpit"]
branch = true

[tool.coverage.report]
# Overall floor. Ratcheted up as tests land: 68 (baseline) → 70 (cli
# direct tests) → 85 (serve+watch coverage push). Never lower — add
# tests instead.
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def demo\\(\\)",             # analyzer self-checks, exercised as __main__
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mutmut]
# Senior QA gate: >=70% mutation kill rate on the analysis path.
# Coverage measures line-hit; mutmut measures whether tests would CATCH
# a bug — a much sharper signal. Not gated per-PR (full run ≈ hours);
# scheduled weekly + on-demand via workflow_dispatch. See cockpit-ci.yml.
#
# Scope is narrowed to the deterministic analysis path — where a silent
# mutation is a real bug. Server/UI/CLI shells are excluded (harder to
# mutation-test, lower payoff — they're mostly wiring).
paths_to_mutate = "src/cockpit/analyzers/,src/cockpit/incremental.py,src/cockpit/diff.py,src/cockpit/baseline.py,src/cockpit/normalize.py,src/cockpit/changeset.py,src/cockpit/indexer.py,src/cockpit/finding.py"
tests_dir = "tests/"
# `-x` bails on the first killed mutant per test run so mutmut can move
# on; `--tb=no -q` keeps its output legible.
runner = "python -m pytest -x --tb=no -q"
