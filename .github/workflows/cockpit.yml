name: cockpit
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install cockpit + dev deps
        run: pip install ".[dev]"
      - name: pytest
        run: pytest -q

  check:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to post PR comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cockpit
        run: pip install .

      # HEAD scan: what's in this commit right now.
      - name: Scan HEAD
        run: |
          cockpit check --json --no-color > head.json
          cockpit check --no-color --baseline

      # BASE scan (PR only): checkout the merge target and scan it too, so the
      # PR comment shows a true machine-receipt diff instead of just "current
      # findings minus baseline". Falls back gracefully if the base ref is
      # unavailable.
      - name: Scan base (PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          git worktree add ../base FETCH_HEAD
          (cd ../base && pip install -q . && cockpit check --json --no-color > /tmp/base.json)
          mv /tmp/base.json base.json

      - name: Build diff receipt
        if: github.event_name == 'pull_request'
        run: cockpit diff base.json head.json --format json > receipt.json

      - name: Build PR comment
        if: github.event_name == 'pull_request'
        run: cockpit diff base.json head.json --format markdown > comment.md

      # Gate: fail only on NEW findings vs baseline (unchanged semantic).
      - name: Baseline gate
        run: cockpit check --exit-code --baseline > /dev/null

      - name: Upload findings + receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-findings
          path: |
            head.json
            base.json
            receipt.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            if (body.includes('no meaningful change')) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
