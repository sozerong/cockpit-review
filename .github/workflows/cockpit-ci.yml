name: cockpit-ci
# Trusted-refs CI: pytest matrix + baseline gate.
#
# Trigger is restricted to trusted code paths:
#   - push to main/dev/v* tags (only maintainers can push there)
#   - pull_request from SAME-REPO branches only (fork PRs are excluded via the
#     head.repo.full_name guard on the job).
#
# Because every ref this workflow runs on has been merged/pushed by someone
# with write access, it's safe to `pip install ".[dev]"` — arbitrary code in
# pyproject.toml has already passed review. Fork PRs are handled by the
# separate cockpit-pr-comment.yml, which uses pull_request_target and never
# installs from PR-head code.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    # Same-repo PRs only. Forks skip this job; they get the read-only diff
    # comment from cockpit-pr-comment.yml instead.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install cockpit + dev deps
        run: pip install ".[dev]"
      - name: pytest
        shell: bash
        # -v so per-test outcomes print; on failure, mirror FAILED /
        # error lines to GitHub annotations (`::error::`) so anon
        # readers of the check-run annotations endpoint can see WHICH
        # test failed without needing Actions log auth.
        run: |
          set -o pipefail
          pytest -v --tb=long 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::group::annotate failures"
            grep -E "^FAILED |^E   |^_+ " pytest.log | head -60 | while IFS= read -r line; do
              # collapse newlines/backticks that would break the annotation
              safe=$(printf '%s' "$line" | tr -d '\r' | sed 's/`/\\`/g')
              echo "::error::$safe"
            done
            echo "::endgroup::"
          fi
          exit $rc
      - name: Upload pytest.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-${{ matrix.python }}
          path: pytest.log
          retention-days: 14

  coverage-gate:
    # Coverage floor is enforced on Ubuntu / Python 3.12 only (the matrix
    # test job already proves the suite passes on every OS/version). Runs
    # in parallel with the matrix, gated on the QA senior review's 70%
    # threshold codified in pyproject.toml [tool.coverage.report].
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cockpit + dev deps
        run: pip install ".[dev]"
      - name: pytest with coverage floor
        run: pytest --cov=cockpit --cov-branch --cov-fail-under=85 -q

  flake-budget:
    # Zero-flake budget: run the suite 5× on Ubuntu/3.12. Any single
    # failure over 5 runs = a flaky test, which the QA senior review
    # said we ship zero of. Bumped from 1 → 5 to catch order-dependent
    # or clock-sensitive tests without exploding CI time.
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cockpit + dev deps
        run: pip install ".[dev]"
      - name: 5× pytest
        run: |
          for i in 1 2 3 4 5; do
            echo "==== run $i ===="
            pytest -q || { echo "FLAKE on run $i"; exit 1; }
          done

  baseline-gate:
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cockpit
        run: pip install .
      - name: Baseline gate
        run: cockpit check --exit-code --baseline > /dev/null
